<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>College Information - CSE-A Batch A2</title>

<style>
  * {
    box-sizing: border-box;
  }

  :root {
    --purple-dark: #32105f;
    --purple: #5b21b6;
    --purple-light: #ede9fe;

    --blue-dark: #123b7a;
    --blue: #2563eb;
    --blue-light: #e8f1ff;

    --gold: #ffd54f;
    --gold-light: #fff4b8;
    --gold-dark: #6b4700;

    --teal: #00695c;
    --teal-light: #dff7f2;

    --orange: #9a4b00;
    --orange-light: #fff0dc;

    --green: #166534;
    --green-light: #e7f7ec;

    --background: #f4f1fa;
    --surface: #ffffff;
    --text: #17121f;
    --muted: #47404f;
    --border: #c8bddb;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    line-height: 1.55;
    color: var(--text);

    background:
      radial-gradient(
        circle at top left,
        #e8ddff 0,
        transparent 30%
      ),
      radial-gradient(
        circle at top right,
        #dceaff 0,
        transparent 30%
      ),
      var(--background);
  }

  /* =========================
     HEADER
     ========================= */

  header {
    padding: 30px 20px;
    text-align: center;
    color: white;

    background:
      linear-gradient(
        135deg,
        var(--purple-dark),
        var(--blue-dark),
        var(--purple)
      );

    border-bottom: 5px solid var(--gold);

    box-shadow:
      0 8px 24px rgba(48, 20, 91, 0.30);
  }

  header h1 {
    margin: 0;
    font-size: clamp(1.8rem, 5vw, 2.7rem);
    letter-spacing: 0.02em;
  }

  header p {
    margin: 8px 0 0;
    color: var(--gold-light);
    font-size: 1rem;
    font-weight: bold;
  }

  /* =========================
     MAIN
     ========================= */

  main {
    width: min(980px, calc(100% - 30px));
    margin: 30px auto 50px;
  }

  /* =========================
     MAIN ACCORDION
     ========================= */

  .item {
    margin-bottom: 20px;
    overflow: hidden;

    background: var(--surface);

    border: 2px solid var(--border);
    border-radius: 16px;

    box-shadow:
      0 8px 24px rgba(43, 25, 77, 0.12);
  }

  button {
    width: 100%;
    min-height: 60px;

    padding: 17px 20px;

    border: 0;
    border-radius: 0;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: space-between;

    text-align: left;

    font-family: inherit;
    font-size: 18px;
    font-weight: 800;

    color: var(--gold);

    background:
      linear-gradient(
        135deg,
        var(--purple),
        var(--blue)
      );

    transition:
      background 0.2s ease,
      transform 0.15s ease;
  }

  button:hover {
    background:
      linear-gradient(
        135deg,
        #7132d1,
        #2875e8
      );
  }

  button:active {
    transform: scale(0.995);
  }

  button:focus-visible {
    outline: 4px solid #111111;
    outline-offset: -4px;

    box-shadow:
      inset 0 0 0 3px white;
  }

  .arrow {
    flex-shrink: 0;

    margin-left: 15px;

    color: var(--gold-light);

    font-size: 1.3rem;

    transition: transform 0.2s ease;
  }

  button[aria-expanded="true"] .arrow {
    transform: rotate(180deg);
  }

  /* =========================
     CONTENT
     ========================= */

  .content {
    padding: 16px;

    background:
      linear-gradient(
        180deg,
        #fbfaff,
        #f7f5fc
      );
  }

  .content[hidden] {
    display: none;
  }

  /* =========================
     DAY ACCORDIONS
     ========================= */

  .nested {
    margin-top: 14px;

    overflow: hidden;

    border: 2px solid var(--border);
    border-radius: 12px;

    background: white;

    box-shadow:
      0 3px 10px rgba(45, 30, 75, 0.07);
  }

  .nested:first-child {
    margin-top: 0;
  }

  .nested button {
    min-height: 54px;

    font-size: 17px;

    color: var(--gold-light);

    background:
      linear-gradient(
        135deg,
        var(--blue-dark),
        var(--purple)
      );
  }

  .nested button:hover {
    background:
      linear-gradient(
        135deg,
        #194d98,
        #6d28d9
      );
  }

  .nested .content {
    padding: 14px;
  }

  /* =========================
     CARD GRID
     ========================= */

  .card-grid {
    display: grid;

    grid-template-columns:
      repeat(2, minmax(0, 1fr));

    gap: 12px;
  }

  .card {
    min-height: 80px;

    padding: 15px;

    border: 2px solid var(--border);
    border-left: 7px solid var(--purple);

    border-radius: 10px;

    background: white;

    color: var(--text);

    box-shadow:
      0 3px 9px rgba(45, 30, 75, 0.07);
  }

  .card strong {
    display: block;

    margin-bottom: 7px;

    color: var(--purple-dark);

    font-size: 1rem;
  }

  .card span {
    color: var(--text);
  }

  /* =========================
     LAB CARDS
     ========================= */

  .card[data-type="lab"] {
    border-left-color: var(--teal);
    background: var(--teal-light);
  }

  .card[data-type="lab"] strong {
    color: var(--teal);
  }

  /* =========================
     SPORTS
     ========================= */

  .card[data-type="sports"] {
    border-left-color: var(--orange);
    background: var(--orange-light);
  }

  .card[data-type="sports"] strong {
    color: var(--orange);
  }

  /* =========================
     TUTORIAL
     ========================= */

  .card[data-type="tutorial"] {
    border-left-color: var(--blue);
    background: var(--blue-light);
  }

  .card[data-type="tutorial"] strong {
    color: var(--blue-dark);
  }

  /* =========================
     A2 BADGE
     ========================= */

  .a2-badge {
    display: inline-block;

    margin-top: 9px;
    padding: 4px 10px;

    border-radius: 999px;

    color: var(--gold-dark);
    background: var(--gold-light);

    border: 1px solid #e0b900;

    font-size: 0.82rem;
    font-weight: 800;
  }

  /* =========================
     LAB INFORMATION
     ========================= */

  .lab-details {
    display: grid;

    grid-template-columns:
      repeat(2, minmax(0, 1fr));

    gap: 14px;

    margin: 0;
  }

  .lab-detail {
    padding: 16px;

    border: 2px solid var(--border);
    border-radius: 11px;

    background: white;

    box-shadow:
      0 3px 10px rgba(45, 30, 75, 0.06);
  }

  .lab-detail:nth-child(1) {
    border-left: 7px solid var(--teal);
    background: var(--teal-light);
  }

  .lab-detail:nth-child(2) {
    border-left: 7px solid var(--blue);
    background: var(--blue-light);
  }

  .lab-detail:nth-child(3) {
    border-left: 7px solid var(--purple);
    background: var(--purple-light);
  }

  .lab-detail:nth-child(4) {
    border-left: 7px solid var(--orange);
    background: var(--orange-light);
  }

  .lab-detail dt {
    margin: 0 0 6px;

    font-weight: 800;
    font-size: 1.05rem;

    color: var(--purple-dark);
  }

  .lab-detail dd {
    margin: 0;

    color: var(--muted);
  }

  /* =========================
     RESPONSIVE
     ========================= */

  @media (max-width: 650px) {

    main {
      width: min(100% - 18px, 980px);
      margin-top: 18px;
    }

    .card-grid,
    .lab-details {
      grid-template-columns: 1fr;
    }

    button {
      padding: 15px;
    }

    .content {
      padding: 10px;
    }
  }

  /* =========================
     REDUCED MOTION
     ========================= */

  @media (prefers-reduced-motion: reduce) {

    html {
      scroll-behavior: auto;
    }

    button,
    .arrow {
      transition: none;
    }
  }
</style>
</head>

<body>

<header>
  <h1>College Information</h1>
  <p>CSE-A • Batch A2</p>
</header>

<main>

  <!-- =========================
       ACADEMIC TIMETABLE
       ========================= -->

  <div class="item">

    <button
      type="button"
      aria-expanded="false"
      aria-controls="timetable">

      Academic Timetable

      <span
        class="arrow"
        aria-hidden="true">
        ⌄
      </span>

    </button>

    <div
      class="content"
      id="timetable"
      hidden>

      <div id="timetable-days"></div>


      <!-- =========================
           LAB INFORMATION
           ========================= -->

      <div class="nested">

        <button
          type="button"
          aria-expanded="false"
          aria-controls="labs">

          Lab Information — Batch A2

          <span
            class="arrow"
            aria-hidden="true">
            ⌄
          </span>

        </button>

        <div
          class="content"
          id="labs"
          hidden>

          <dl class="lab-details">

            <div class="lab-detail">
              <dt>Electronics Lab (EDC)</dt>
              <dd>Fourth Floor</dd>
              <span class="a2-badge">Batch A2</span>
            </div>

            <div class="lab-detail">
              <dt>Electrical Lab (EEE)</dt>
              <dd>Third Floor</dd>
              <span class="a2-badge">Batch A2</span>
            </div>

            <div class="lab-detail">
              <dt>CP Lab</dt>
              <dd>Lab 1 — Fifth Floor</dd>
              <span class="a2-badge">Batch A2</span>
            </div>

            <div class="lab-detail">
              <dt>AS Lab</dt>
              <dd>Second Floor</dd>
              <span class="a2-badge">Batch A2</span>
            </div>

          </dl>

        </div>
      </div>

    </div>
  </div>


  <!-- =========================
       MESS MENU
       ========================= -->

  <div class="item">

    <button
      type="button"
      aria-expanded="false"
      aria-controls="mess-menu">

      Mess Menu

      <span
        class="arrow"
        aria-hidden="true">
        ⌄
      </span>

    </button>

    <div
      class="content"
      id="mess-menu"
      hidden>

      <div id="mess-days"></div>

    </div>

  </div>

</main>


<script>

/* =========================================================
   CSE-A BATCH A2 TIMETABLE
   ========================================================= */

const timetable = {

  "Monday": {

    "9–10": "CP",

    "10–11": "CE",

    "11–12": "AS",

    "12–1": "EDC",

    "2–4": "EDC Lab — Batch A2"

  },


  "Tuesday": {

    "10–11": "CE",

    "11–12": "AS",

    "12–1": "CP",

    "4–6": "SPORTS"

  },


  "Wednesday": {

    "9–10": "CE Tute — Batch A2",

    "10–11": "CE",

    "11–12": "AS",

    "12–1": "EEE",

    "2–4": "AS Lab — Batch A2"

  },


  "Thursday": {

    "10–11": "EVS",

    "11–12": "CP",

    "12–1": "EDC",

    "2–4": "EEE Lab — Batch A2"

  },


  "Friday": {

    "9–10": "EVS",

    "10–11": "EEE",

    "11–12": "EDC",

    "12–1": "EEE",

    "2–4": "CP Lab — Batch A2, Lab 1"

  }

};


/* =========================================================
   MESS MENU
   ========================================================= */

const menu = {

  "Monday": {

    "Breakfast":
      "Nimbu Pani, Aaloo Sabji, Seasonal Fruit",

    "Lunch":
      "Kadhi Pakoda, Aaloo Gobhi (Dry), Chapati, Rice, Salad, Achar, Papad",

    "Snacks":
      "Corn / Chana Chaat",

    "Dinner":
      "Dry Masala Bhindi, Mix Dal, Chapati, Rice, Salad, Achar"

  },


  "Tuesday": {

    "Breakfast":
      "Besan / Moong Dal Chilla, Sauce, Hari Chutney",

    "Lunch":
      "Sev Tamatar, Chana Daal, Chapati, Matar Rice, Salad, Achar, Dahi",

    "Snacks":
      "Maggi",

    "Dinner":
      "Dry Aaloo Jeera, Daal, Poori, Rice, Salad, Achar, Thecha, Kheer / Fruit Custard"

  },


  "Wednesday": {

    "Breakfast":
      "Veg Uttapam, Sambhar, Chutney, Seasonal Fruit",

    "Lunch":
      "Mix Kathol, Gajar Matar Sabzi, Veg Pulao, Chapati, Salad, Achar, Chhachh",

    "Snacks":
      "Dhokla / Mayo Corn Sandwich",

    "Dinner":
      "Matar Paneer, Chapati, Jeera Rice, Daal Tadka, Salad, Achar"

  },


  "Thursday": {

    "Breakfast":
      "Poha, Sev, Chana Curry, Sprouts",

    "Lunch":
      "Soya Wadi, Masoor Dal, Chapati, Rice, Salad, Achar, Lassi",

    "Snacks":
      "Vada Pav (2 pc), Hari and Lal Chutney",

    "Dinner":
      "Gatte Ki Sabzi, Chapati, Rice, Salad, Achar, Jalebi / Imarti / Gulab Jamun"

  },


  "Friday": {

    "Breakfast":
      "Vada, Sambhar, Chutney, Seasonal Fruit",

    "Lunch":
      "Desi Chana/Gravy, Moong Dal, Chapati, Matar Rice, Salad, Achar, Dahi",

    "Snacks":
      "Arabian Red Sauce Pasta",

    "Dinner":
      "Palak Corn, Daal Makhni, Rice, Lemon Rice, Salad, Achar, Thecha"

  },


  "Saturday": {

    "Breakfast":
      "Aaloo Paratha, Dahi, Sprouts",

    "Lunch":
      "Veg Biryani, Rajma, Chapati, Papad, Salad, Achar, Chhachh",

    "Snacks":
      "Pav Bhaji",

    "Dinner":
      "Kadhai Paneer, Daal Fry, Chapati, Jeera Rice, Salad, Achar, Ice Cream"

  },


  "Sunday": {

    "Breakfast":
      "Masala Dosa, Sambhar, Chutney, Seasonal Fruit",

    "Lunch":
      "Chhole – Puri, Masoori Daal, Rice, Salad, Achar, Papad, Boondi Raita",

    "Snacks":
      "Bhel / Pyaz Bhajiya",

    "Dinner":
      "Dum Aaloo / Aaloo Parwal, Masala Rice / Khichdi, Chapati, Salad, Achar"

  }

};


/* =========================================================
   CARD COLOUR CATEGORY
   ========================================================= */

function getCardType(value) {

  const text = value.toLowerCase();

  if (text.includes("lab")) {
    return "lab";
  }

  if (text.includes("sports")) {
    return "sports";
  }

  if (
    text.includes("tute") ||
    text.includes("tutorial")
  ) {
    return "tutorial";
  }

  return "class";
}


/* =========================================================
   CREATE ACCORDIONS
   ========================================================= */

function createAccordion(
  containerId,
  data,
  prefix
) {

  const container =
    document.getElementById(containerId);


  Object.entries(data).forEach(
    ([name, entries], index) => {

      const id =
        prefix + "-" + index;


      const box =
        document.createElement("div");

      box.className = "nested";


      const cards =
        Object.entries(entries)
          .map(([title, value]) => {

            const type =
              getCardType(value);


            return `
              <div
                class="card"
                data-type="${type}">

                <strong>
                  ${title}
                </strong>

                <span>
                  ${value}
                </span>

              </div>
            `;

          })
          .join("");


      box.innerHTML = `

        <button
          type="button"
          aria-expanded="false"
          aria-controls="${id}">

          ${name}

          <span
            class="arrow"
            aria-hidden="true">
            ⌄
          </span>

        </button>


        <div
          class="content"
          id="${id}"
          hidden>

          <div class="card-grid">

            ${cards}

          </div>

        </div>

      `;


      container.appendChild(box);

    }
  );

}


/* =========================================================
   BUILD PAGE
   ========================================================= */

createAccordion(
  "timetable-days",
  timetable,
  "time-day"
);


createAccordion(
  "mess-days",
  menu,
  "menu-day"
);


/* =========================================================
   ACCORDION CONTROL
   ========================================================= */

document.addEventListener(
  "click",
  function(event) {

    const button =
      event.target.closest("button");


    if (!button) {
      return;
    }


    const id =
      button.getAttribute("aria-controls");


    if (!id) {
      return;
    }


    const content =
      document.getElementById(id);


    if (!content) {
      return;
    }


    const expanded =
      button.getAttribute(
        "aria-expanded"
      ) === "true";


    button.setAttribute(
      "aria-expanded",
      String(!expanded)
    );


    content.hidden =
      expanded;

  }
);

</script>

</body>
</html>
